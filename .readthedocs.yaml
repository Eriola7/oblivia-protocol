# Read the Docs build: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "22"
  jobs:
    pre_build:
      # Generate the SDK and program references from the code.
      - npm ci --prefix sdk
      - npm ci --prefix tools/docs
      - node tools/docs/generate.js

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: tools/docs/requirements.txt
