name: Devnet program buffer

# Builds the program at the selected commit and uploads it to a Devnet buffer
# owned by the program's upgrade authority. The upgrade itself is a single
# transaction signed locally by that authority:
#   solana program upgrade <BUFFER> HaRpXyybfpYpwxkhfj8CjY8EjGqvRd96Zi33iSCTxvHG \
#     --upgrade-authority <authority keypair> --url devnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buffer:
    runs-on: ubuntu-latest
    env:
      UPGRADE_AUTHORITY: Fc6CNcvqNS9uccFBvnSTvryTAGBpkBDr2okV63Kbf8wo
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain from rust-toolchain.toml
        working-directory: oblivia-contracts
        run: rustup toolchain install
      - name: Install Solana build tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the program
        working-directory: oblivia-contracts
        run: cargo build-sbf --manifest-path programs/oblivia-contracts/Cargo.toml
      - name: Run the in-VM program tests
        working-directory: oblivia-contracts
        run: cargo test -p oblivia-contracts --test multisig_proof_gate
      - name: Upload to a Devnet buffer
        working-directory: oblivia-contracts
        env:
          PAYER: ${{ secrets.OBLIVIA_BUFFER_PAYER }}
        run: |
          umask 077
          printf '%s' "$PAYER" > "$RUNNER_TEMP/payer.json"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$RUNNER_TEMP/buffer.json"
          BUFFER=$(solana address -k "$RUNNER_TEMP/buffer.json")
          HASH=$(sha256sum target/deploy/oblivia_contracts.so | cut -d' ' -f1)
          solana program write-buffer target/deploy/oblivia_contracts.so \
            --buffer "$RUNNER_TEMP/buffer.json" \
            --keypair "$RUNNER_TEMP/payer.json" \
            --url devnet \
            --use-rpc --with-compute-unit-price 20000 --max-sign-attempts 50
          solana program set-buffer-authority "$BUFFER" \
            --new-buffer-authority "$UPGRADE_AUTHORITY" \
            --keypair "$RUNNER_TEMP/payer.json" \
            --url devnet
          {
            echo "### Devnet buffer ready"
            echo
            echo "- Buffer: \`$BUFFER\`"
            echo "- Authority: \`$UPGRADE_AUTHORITY\`"
            echo "- Program SHA-256: \`$HASH\`"
            echo
            echo '```'
            echo "solana program upgrade $BUFFER HaRpXyybfpYpwxkhfj8CjY8EjGqvRd96Zi33iSCTxvHG \\"
            echo "  --upgrade-authority ~/.config/solana/oblivia-devnet.json \\"
            echo "  --keypair ~/.config/solana/oblivia-devnet.json --url devnet"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/payer.json" "$RUNNER_TEMP/buffer.json"
