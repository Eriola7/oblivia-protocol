site_name: Oblivia Protocol
site_description: Zero-identity contract signing on Solana with on-chain Groth16 verification.
site_url: https://oblivia-protocol.readthedocs.io/
repo_url: https://github.com/Eriola7/oblivia-protocol
repo_name: Eriola7/oblivia-protocol
edit_uri: edit/main/docs/
copyright: MIT License
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - SDK guide: sdk.md
  - Reference:
      - SDK API: reference/sdk/index.md
      - Program instructions: reference/program.md
      - Relay API: reference/relay-api.md
  - Protocol:
      - Specification: SPEC.md
      - Technical specification: TECHNICAL_SPECIFICATION.md
      - Architecture: ARCHITECTURE.md
  - Security:
      - Threat model: THREAT_MODEL.md
      - Audit scope: AUDIT_SCOPE.md
      - Trusted setup: CEREMONY.md
      - Ceremony contributor guide: CEREMONY_CONTRIBUTOR.md
  - Operations:
      - Deployment: DEPLOYMENT.md
  - Project: project.md
